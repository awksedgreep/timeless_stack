name: Container

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: awksedgreep/timeless-stack

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout timeless_stack
        uses: actions/checkout@v4
        with:
          path: timeless_stack

      - name: Read pinned telemetry data-plane revision
        id: telemetry
        run: echo "ref=$(tr -d '\n' < timeless_stack/telemetry-data-plane.lock)" >> "$GITHUB_OUTPUT"

      - name: Checkout timeless-libsql
        uses: actions/checkout@v4
        with:
          repository: awksedgreep/timeless-libsql
          ref: ${{ steps.telemetry.outputs.ref }}
          path: timeless-libsql

      - name: Resolve telemetry build identity
        id: telemetry-identity
        run: echo "commit=$(git -C timeless-libsql rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Copy .dockerignore to workspace root
        run: cp timeless_stack/.dockerignore .dockerignore

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: timeless_stack/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TIMELESS_BUILD_COMMIT=${{ steps.telemetry-identity.outputs.commit }}
