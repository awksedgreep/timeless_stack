name: Container

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: awksedgreep/timeless-stack

jobs:
  build:
    name: Build ${{ matrix.arch }} image with Podman
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout timeless_stack
        uses: actions/checkout@v4
        with:
          path: timeless_stack

      # Resolved at build time rather than pinned. telemetry-data-plane.lock
      # used to hold a bare commit SHA — a72634e, which `git describe` calls
      # v0.3.0-49-ga72634e: an untagged mid-stream commit written to unblock
      # container networking on 2026-08-03. It never moved again, so every
      # image for five weeks shipped a data plane 49 commits past v0.3.0 while
      # the extension reached v0.6.0, and nothing ever said so. A pin cannot
      # report its own staleness, so it rots in silence while each release
      # looks green.
      #
      # Releases are still deliberate: only tagged versions of timeless-libsql
      # are eligible, so an in-flight commit can never reach an image. What is
      # gone is the freeze. The exact commit is recorded below and baked into
      # the image, so a build stays identifiable after the fact without a
      # checked-in pin having to be remembered and advanced by hand.
      # The image consumes the release ARCHIVES, not a source build: those
      # binaries were identity-checked and install/remove-drilled by the
      # data-plane release pipeline, and rebuilding them here cost ~100
      # minutes per image. Only tagged releases with published artifacts are
      # eligible — a source-only tag (v0.4.0, v0.6.3, v0.7.0) fails this
      # image build loudly at download time, which is the correct outcome.
      - name: Resolve newest telemetry data-plane release
        id: telemetry-identity
        run: |
          mapfile -t releases < <(git ls-remote --tags --refs --sort=-v:refname \
            https://github.com/awksedgreep/timeless-libsql 'v*')
          line="${releases[0]:-}"
          ref="${line##*refs/tags/}"
          commit="${line%%$'\t'*}"
          if [ -z "$ref" ]; then
            echo "::error::no release tag found on timeless-libsql; refusing to" \
                 "build against an unreleased data plane."
            exit 1
          fi
          peeled="$(git ls-remote https://github.com/awksedgreep/timeless-libsql \
            "refs/tags/$ref^{}")"
          if [ -n "$peeled" ]; then
            commit="${peeled%%$'\t'*}"
          fi
          echo "building against timeless-libsql $ref ($commit)"
          echo "release=$ref" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Extract version from tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GHCR with Podman
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | podman login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin

      - name: Copy container ignore file to workspace root
        run: cp timeless_stack/.containerignore .containerignore

      - name: Build with Podman
        run: |
          image="$REGISTRY/$IMAGE_NAME:${{ steps.meta.outputs.version }}-${{ matrix.arch }}"
          podman build \
            --platform "linux/${{ matrix.arch }}" \
            --ignorefile .containerignore \
            --file timeless_stack/Containerfile \
            --build-arg "TARGETARCH=${{ matrix.arch }}" \
            --build-arg "TIMELESS_BUILD_COMMIT=${{ steps.telemetry-identity.outputs.commit }}" \
            --build-arg "TIMELESS_BUILD_RELEASE=${{ steps.telemetry-identity.outputs.release }}" \
            --tag "$image" \
            .
          podman push "$image"

  publish-manifest:
    name: Publish multi-architecture manifest with Podman
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Extract version from tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GHCR with Podman
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | podman login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish versioned and latest manifests
        run: |
          versioned="$REGISTRY/$IMAGE_NAME:${{ steps.meta.outputs.version }}"
          podman manifest create "$versioned" \
            "$versioned-amd64" \
            "$versioned-arm64"
          podman manifest push --all "$versioned" "$versioned"
          podman manifest push --all "$versioned" "$REGISTRY/$IMAGE_NAME:latest"
